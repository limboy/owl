name: Owl
options:
  bundleIdPrefix: me.limboy
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.9.1"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    OTHER_SWIFT_FLAGS:
      - "-Xcc"
      - "-DGL_SILENCE_DEPRECATION"
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  CMPVShim:
    type: framework
    platform: macOS
    sources:
      - path: CMPVShim
        excludes:
          - include
    headers:
      public:
        - CMPVShim/CMPVShim.h
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.limboy.owl.CMPVShim
        PRODUCT_MODULE_NAME: CMPVShim
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/CMPVShim"
  Owl:
    type: application
    platform: macOS
    # Carries TMDB_API_KEY, the metadata service key baked into the bundle.
    # It lives in an xcconfig rather than here because a target build setting
    # would override the file, and because the key is a secret this file is
    # not. See Owl/Support/Owl.xcconfig.
    configFiles:
      Debug: Owl/Support/Owl.xcconfig
      Release: Owl/Support/Owl.xcconfig
    sources:
      - Owl
      - path: Assets/owl.icon
        buildPhase: resources
    dependencies:
      - target: CMPVShim
      - package: Sparkle
      - target: OwlPreview
        embed: true
      - target: OwlThumbnail
        embed: true
    info:
      path: Owl/Support/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUFeedURL: https://github.com/limboy/owl/releases/latest/download/appcast.xml
        SUPublicEDKey: B6+JHJ8tGYlOk0bFN5Ldnn+U40ebdkWsqWYg9nZMh0A=
        OWLTMDBAPIKey: $(TMDB_API_KEY)
        # Lets the Finder hand video files to Owl, through Open With or by
        # dropping them on the icon. The rank is Alternate deliberately: the app
        # offers to open these, it does not claim them from whatever the Mac
        # already opens them with.
        #
        # The first entry covers everything the system knows is video. The
        # second lists extensions for Open With compatibility. Imported types
        # above let Quick Look route containers macOS does not declare itself.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [mkv]
              public.mime-type: video/x-matroska
          - UTTypeIdentifier: org.webmproject.webm
            UTTypeDescription: WebM Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [webm]
              public.mime-type: video/webm
          - UTTypeIdentifier: com.microsoft.advanced-systems-format
            UTTypeDescription: Advanced Systems Format
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [asf]
              public.mime-type: video/x-ms-asf
          - UTTypeIdentifier: com.microsoft.windows-media-wmv
            UTTypeDescription: Windows Media Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [wmv]
              public.mime-type: video/x-ms-wmv
          - UTTypeIdentifier: com.divx.video
            UTTypeDescription: DivX Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [divx]
              public.mime-type: video/divx
          - UTTypeIdentifier: com.adobe.flash.video
            UTTypeDescription: Flash Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [flv]
              public.mime-type: video/x-flv
          - UTTypeIdentifier: com.adobe.f4v
            UTTypeDescription: Flash MP4 Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [f4v]
              public.mime-type: video/mp4
          - UTTypeIdentifier: org.xiph.ogv
            UTTypeDescription: Ogg Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [ogv, ogm]
              public.mime-type: video/ogg
          - UTTypeIdentifier: com.real.realmedia
            UTTypeDescription: RealMedia Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [rm, rmvb]
              public.mime-type: application/vnd.rn-realmedia
          - UTTypeIdentifier: public.mpeg-2-transport-stream
            UTTypeDescription: MPEG Transport Stream
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [ts, mts, m2t, m2ts]
              public.mime-type: video/mp2t
          - UTTypeIdentifier: public.mpeg-2-video
            UTTypeDescription: MPEG-2 Video
            UTTypeConformsTo: [public.movie]
            UTTypeTagSpecification:
              public.filename-extension: [vob]
              public.mime-type: video/mpeg
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.movie
              - public.audiovisual-content
          - CFBundleTypeName: Video File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - 3g2
              - 3gp
              - asf
              - avi
              - divx
              - dv
              - f4v
              - flv
              - m2t
              - m2ts
              - m4v
              - mkv
              - mov
              - mp4
              - mpeg
              - mpg
              - mts
              - ogm
              - ogv
              - rm
              - rmvb
              - ts
              - vob
              - webm
              - wmv
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: owl
        PRODUCT_BUNDLE_IDENTIFIER: me.limboy.owl
        PRODUCT_NAME: Owl
        PRODUCT_MODULE_NAME: Owl
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Owl
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Limboy"
        CODE_SIGN_ENTITLEMENTS: Owl/Support/Owl.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ldl"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
    postbuildScripts:
      - name: Embed mpv runtime
        path: scripts/embed-mpv-runtime.sh
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - OwlTests
  OwlTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - OwlTests
    dependencies:
      - target: Owl
      - target: CMPVShim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.limboy.owl.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Owl.app/Contents/MacOS/Owl"
        BUNDLE_LOADER: "$(TEST_HOST)"
  OwlPreview:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.limboy.owl.preview
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: OwlQuickLook/Extension.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../../../Frameworks"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
    sources:
      - path: OwlQuickLook/Preview
        excludes: ["*.entitlements"]
      - Owl/Player/MPVPlayerEngine.swift
      - Owl/Player/LibMPVLoader.swift
      - Owl/Player/MPVCallbackContext.swift
      - Owl/Player/PlayerState.swift
      - Owl/Player/PlayerNotice.swift
      - Owl/Player/Chapter.swift
      - Owl/Player/SubtitleLanguage.swift
    dependencies:
      - target: CMPVShim
        embed: false
    info:
      path: OwlQuickLook/Preview/Info.plist
      properties:
        CFBundleDisplayName: Owl Preview
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - public.movie
              - public.mpeg-4
              - com.apple.quicktime-movie
              - com.apple.m4v-video
              - public.avi
              - public.dv-movie
              - public.mpeg
              - public.3gpp
              - public.3gpp2
              - org.matroska.mkv
              - org.webmproject.webm
              - com.microsoft.advanced-systems-format
              - com.microsoft.windows-media-wmv
              - com.divx.video
              - com.adobe.flash.video
              - com.adobe.f4v
              - org.xiph.ogv
              - com.real.realmedia
              - public.mpeg-2-transport-stream
              - public.mpeg-2-video
            QLSupportsSearchableItems: false
  OwlThumbnail:
    type: app-extension
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.limboy.owl.thumbnail
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: OwlQuickLook/Extension.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../../../../Frameworks"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
    sources:
      - path: OwlQuickLook/Thumbnail
        excludes: ["*.entitlements"]
      - Owl/Player/LibMPVLoader.swift
    dependencies:
      - target: CMPVShim
        embed: false
    info:
      path: OwlQuickLook/Thumbnail/Info.plist
      properties:
        CFBundleDisplayName: Owl Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLSupportedContentTypes:
              - public.movie
              - public.mpeg-4
              - com.apple.quicktime-movie
              - com.apple.m4v-video
              - public.avi
              - public.dv-movie
              - public.mpeg
              - public.3gpp
              - public.3gpp2
              - org.matroska.mkv
              - org.webmproject.webm
              - com.microsoft.advanced-systems-format
              - com.microsoft.windows-media-wmv
              - com.divx.video
              - com.adobe.flash.video
              - com.adobe.f4v
              - org.xiph.ogv
              - com.real.realmedia
              - public.mpeg-2-transport-stream
              - public.mpeg-2-video
            QLThumbnailMinimumDimension: 0

<div id="owl-resume" aria-label="Owl 继续观看设计">
<style>
#owl-resume{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:light-dark(#242424,#eee);--owl-bg:light-dark(#fafafa,#232323);--owl-side:light-dark(#efefef,#2c2c2c);--owl-muted:light-dark(#666,#b0b0b0);--owl-line:light-dark(#ddd,#444);--owl-active:light-dark(#dcdcdc,#494949);background:var(--owl-bg);border:1px solid var(--owl-line);border-radius:12px;overflow:hidden}#owl-resume *{box-sizing:border-box}#owl-resume button{font:inherit;color:inherit;cursor:pointer}#owl-resume .shell{display:grid;grid-template-columns:190px 1fr;min-height:440px}#owl-resume aside{background:var(--owl-side);padding:18px 10px}#owl-resume .dots{display:flex;gap:8px;margin:0 0 28px 8px}#owl-resume .dots i{width:11px;height:11px;border-radius:50%;background:var(--owl-muted);opacity:.55}#owl-resume .nav{padding:9px 10px;border-radius:6px;background:var(--owl-active);font-weight:500}#owl-resume .folder{padding:9px 10px;color:var(--owl-muted)}#owl-resume .group{font-size:12px;color:var(--owl-muted);margin:28px 10px 6px}#owl-resume main{min-width:0}#owl-resume header{height:65px;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--owl-line);gap:8px}#owl-resume h2{font-size:15px;margin:0;font-weight:600}#owl-resume .switch{display:flex;gap:3px}#owl-resume .switch button,#owl-resume .back{border:0;background:var(--owl-side);padding:6px 10px;border-radius:5px}#owl-resume .switch button[aria-pressed=true]{background:var(--owl-active)}#owl-resume .items{padding:24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px}#owl-resume article{min-width:0;position:relative}#owl-resume .resume{display:block;width:100%;text-align:left;padding:0;border:0;background:transparent}#owl-resume .thumb{aspect-ratio:16/9;display:grid;place-items:center;border-radius:7px;position:relative;overflow:hidden;background:light-dark(#dce1e3,#354149)}#owl-resume .orb{height:62%;aspect-ratio:1;border-radius:50%;background:light-dark(#bac5c9,#516371);box-shadow:25px 9px 0 light-dark(#cbd4d7,#40525f)}#owl-resume .play{position:absolute;inset:0;display:grid;place-items:center;color:light-dark(#25343d,#f5f5f5);font-size:24px}#owl-resume .progress{position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--owl-line)}#owl-resume .progress span{display:block;height:100%;background:light-dark(#2378dc,#5ea6ff)}#owl-resume .title{font-weight:500;margin-top:11px;display:block;padding-right:27px}#owl-resume .meta{display:block;margin-top:5px;color:var(--owl-muted);font-size:12px}#owl-resume .more{position:absolute;right:0;bottom:36px;border:0;background:transparent;padding:4px}#owl-resume .actions{position:absolute;right:0;bottom:65px;background:var(--owl-bg);border:1px solid var(--owl-line);border-radius:7px;padding:4px;z-index:2;box-shadow:0 5px 18px #0002;min-width:160px}#owl-resume .actions button{display:block;text-align:left;width:100%;padding:8px;border:0;background:transparent}#owl-resume .actions button:hover{background:var(--owl-active)}#owl-resume .items.list{grid-template-columns:1fr}#owl-resume .list .resume{display:grid;grid-template-columns:135px 1fr;column-gap:16px}#owl-resume .list .thumb{grid-row:1/4}#owl-resume .list .title{margin-top:5px}#owl-resume .list .more{bottom:28px}#owl-resume .player{background:#14191e;color:#eee;min-height:440px;padding:22px;display:flex;flex-direction:column;justify-content:space-between}#owl-resume .player .back{align-self:flex-start;background:#343b42;color:#eee}#owl-resume .scene{text-align:center;padding:64px 0;color:#c7d2dc}#owl-resume .scene strong{font-size:22px;font-weight:500}#owl-resume .player p{font-size:13px}#owl-resume .notice{padding:0 24px 16px;color:var(--owl-muted);font-size:12px}#owl-resume [hidden]{display:none!important}@media(max-width:600px){#owl-resume .shell{grid-template-columns:125px 1fr}#owl-resume .items{grid-template-columns:1fr;padding:16px}#owl-resume header{padding:14px}#owl-resume .list .resume{display:block}}@media(max-width:380px){#owl-resume .shell{grid-template-columns:1fr}#owl-resume aside{padding:10px}#owl-resume .dots,#owl-resume .group,#owl-resume .folder{display:none}}
</style>
<div class="shell"><aside><div class="dots"><i></i><i></i><i></i></div><div class="nav">◷　继续观看</div><div class="group">文件夹</div><div class="folder">▱　电视剧</div><div class="folder">▱　电影</div><div class="folder">▱　课程</div></aside><main><header><h2>继续观看</h2><div class="switch"><button data-layout="grid" aria-label="网格视图" aria-pressed="true">▦</button><button data-layout="list" aria-label="列表视图" aria-pressed="false">☰</button></div></header><div class="items"></div><div class="notice" aria-live="polite"></div></main></div>
<div class="player" hidden><button class="back">‹ 返回继续观看</button><div class="scene"><strong></strong><p class="position"></p><p>播放界面示意</p></div><div>❚❚ <span class="time"></span></div></div>
<script>
(()=>{const root=document.getElementById('owl-resume');const config={layout:'grid'};let records=[{title:'The Expanse · S01E02',source:'电视剧 / The Expanse / Season 1',time:'18:42',left:'剩余 24 分钟 · 今天',progress:44},{title:'Arrival (2016)',source:'电影',time:'42:15',left:'剩余 74 分钟 · 昨天',progress:36},{title:'Designing with type · 03',source:'课程 / Typography',time:'12:08',left:'剩余 19 分钟 · 周一',progress:39}];const items=root.querySelector('.items');const notice=root.querySelector('.notice');function play(item,start=false){root.querySelector('.shell').hidden=true;root.querySelector('.player').hidden=false;root.querySelector('.scene strong').textContent=item.title;root.querySelector('.position').textContent=start?'从头播放':'从 '+item.time+' 继续';root.querySelector('.time').textContent=start?'00:00':item.time;}function render(){items.className='items '+config.layout;items.innerHTML='';root.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===config.layout)));records.forEach(item=>{const article=document.createElement('article');article.innerHTML='<button class="resume"><span class="thumb"><span class="orb"></span><span class="play">▶</span><span class="progress"><span style="width:'+item.progress+'%"></span></span></span><span class="title">'+item.title+'</span><span class="meta">'+item.left+'</span><span class="meta">'+item.source+'</span></button><button class="more" aria-label="'+item.title+' 的更多操作" aria-expanded="false">•••</button><div class="actions" hidden><button data-action="restart">从头播放</button><button data-action="watched">标记已看</button><button data-action="remove">从继续观看中移除</button></div>';article.querySelector('.resume').onclick=()=>play(item);const menu=article.querySelector('.actions'),more=article.querySelector('.more');more.onclick=()=>{menu.hidden=!menu.hidden;more.setAttribute('aria-expanded',String(!menu.hidden))};menu.onclick=e=>{const action=e.target.dataset.action;if(!action)return;if(action==='restart'){play(item,true);return}records=records.filter(r=>r!==item);render();notice.textContent=action==='remove'?'已从继续观看中移除，保留播放进度。':'已标记为已看。';const undo=document.createElement('button');undo.textContent='撤销';undo.onclick=()=>{records.push(item);render();notice.textContent=''};notice.append(' ',undo)};items.append(article)});if(!records.length)notice.textContent='还没有看到一半的视频。'}root.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{config.layout=b.dataset.layout;render()});root.querySelector('.back').onclick=()=>{root.querySelector('.player').hidden=true;root.querySelector('.shell').hidden=false};render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSelect(config,'layout',{label:'内容布局',options:[{label:'网格',value:'grid'},{label:'列表',value:'list'}]})}})();
</script>
</div>
